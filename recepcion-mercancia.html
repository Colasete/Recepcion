<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

#rm-root {
  --bg: #F1F2EE;
  --panel: #FFFFFF;
  --ink: #1B2733;
  --ink-soft: #5B6670;

}

}

.rm-toolbar {
  display: flex;

.rm-overlay { position: fixed; inset: 0; background: rgba(22, 40, 58, 0.55); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }

.rm-row2 { display: flex; gap: 10px; }

}

.rm-scan-modal { max-width: 460px; }
.rm-scan-input {

}
.rm-scan-form-row { display: flex; gap: 8px; align-items: stretch; }
.rm-scan-form-row .rm-scan-input { margin-bottom: 0; flex: 1; }
.rm-scan-accept-btn {
  background: var(--navy); color: #fff; border: none; font-family: 'Barlow Semi Condensed', sans-serif;
  font-weight: 700; font-size: 15px; padding: 0 18px; border-radius: var(--radius); cursor: pointer; white-space: nowrap;
}
.rm-scan-hint { font-size: 11px; color: var(--ink-soft); margin: 0 0 14px 0; }
.rm-scan-error { font-size: 12px; color: #A2402A; background: #FBEBE7; padding: 8px 10px; border-radius: var(--radius); margin-bottom: 10px; }
.rm-scan-notfound-panel { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
.rm-scan-notfound-panel select { width: 100%; margin-bottom: 8px; }
.rm-scan-notfound-actions { display: flex; flex-direction: column; gap: 8px; }
.rm-scan-or { text-align: center; font-size: 10.5px; color: var(--ink-soft); margin: 2px 0; }
.rm-scan-panel { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-bottom: 14px; }
.rm-scan-panel h4 { font-family: 'Barlow Semi Condensed', sans-serif; font-size: 17px; margin: 0 0 3px 0; }
.rm-scan-panel .rm-scan-meta { font-size: 11.5px; color: var(--ink-soft); margin-bottom: 10px; }
.rm-scan-progress-bar { background: #EDF0F2; border-radius: 20px; height: 10px; overflow: hidden; margin-bottom: 6px; }
.rm-scan-progress-fill { height: 100%; background: #3E8A5B; }

.rm-scan-count { font-size: 13px; font-weight: 600; margin-bottom: 10px; }
.rm-scan-count.rm-over-text { color: #A2402A; }
.rm-scan-remaining { font-size: 11.5px; color: #8A5A11; background: var(--amber-soft); display: inline-block; padding: 3px 9px; border-radius: 20px; margin: -4px 0 10px 0; }
.rm-scan-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.rm-btn-confirm {
  background: #3E8A5B; color: #fff; border: none; font-family: 'Barlow Semi Condensed', sans-serif;
  font-weight: 700; font-size: 14px; padding: 8px 14px; border-radius: var(--radius); cursor: pointer;
}
.rm-btn-confirm:disabled { background: #A9C6B5; cursor: not-allowed; }
.rm-scan-log { list-style: none; margin: 10px 0 0 0; padding: 0; max-height: 100px; overflow-y: auto; font-size: 10.5px; color: var(--ink-soft); }
.rm-scan-log li { padding: 3px 0; border-bottom: 1px dashed var(--line); }
.rm-historial { list-style: none; margin: 0 0 10px 0; padding: 0; max-height: 130px; overflow-y: auto; border: 1px solid var(--line); border-radius: var(--radius); }

.rm-historial .rm-h-time { color: var(--ink-soft); display: block; font-size: 10px; }

.rm-add-update button { background: var(--navy); color: #fff; border: none; border-radius: var(--radius); font-size: 12px; padding: 0 12px; cursor: pointer; }
.rm-notif-hint { font-size: 10.5px; color: var(--ink-soft); margin: -6px 0 10px 0; }
</style>

<div id="rm-root">
  <div class="rm-header">
    <div>
      <h1>RECEPCIÓN DE MERCANCÍA</h1>
      <p>Tablero compartido del equipo para organizar las llegadas por día y estado. Compras añade el seguimiento y aquí queda registrado para todos.</p>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="rm-add-btn" id="rm-open-scan" style="background:#fff; color:var(--navy);">📦 Escanear recepción</button>
      <button class="rm-add-btn" id="rm-open-carriers" style="background:#fff; color:var(--navy);">🔗 Transportistas</button>
      <button class="rm-add-btn" id="rm-open-emails" style="background:#fff; color:var(--navy);">✉️ Emails</button>
      <button class="rm-add-btn" id="rm-open-add">+ Nueva llegada</button>
    </div>
  </div>

  <div class="rm-tabs">
    <button class="rm-tab rm-tab-active" id="rm-tab-kanban">Tablero</button>
    <button class="rm-tab" id="rm-tab-carrier">Por transportista</button>
  </div>

  <div class="rm-toolbar">
    <input type="text" id="rm-search" placeholder="Buscar proveedor, pedido, transportista..." />
    <select id="rm-filter-resp"><option value="">Todos los responsables</option></select>
    <button class="rm-notif-btn" id="rm-notif-toggle">🔔 Activar avisos en este dispositivo</button>
    <div class="rm-summary" id="rm-summary"></div>
  </div>

  <div class="rm-avisos" id="rm-avisos"></div>

  <div id="rm-status-msg" class="rm-status-msg">Cargando tablero...</div>

  <div class="rm-board" id="rm-board"></div>
  <div class="rm-carrier-view" id="rm-carrier-view" style="display:none;"></div>
</div>

<script>
(function(){
  const ESTADOS = [
    { key: 'programado', label: 'Programado', color: '#5C6B7A' },
    { key: 'transito',   label: 'En tránsito', color: '#2F7C77' },
    { key: 'hoy',        label: 'Llegando hoy', color: '#D98A25' },
    { key: 'recibido',   label: 'Recibido', color: '#3E8A5B' },
    { key: 'incidencia', label: 'Incidencia', color: '#C0533B' }
  ];
  const STORAGE_KEY = 'recepcion-mercancia-board';
  const POLL_MS = 30000;

  let arrivals = [];
  let lastSnapshot = null;
  let editingId = null;
  let searchTerm = '';
  let respFilter = '';
  let quickFilter = null; // 'atrasados' | 'hoy' | 'actualizados'
  let notifEnabled = false;
  let viewMode = 'kanban'; // 'kanban' | 'carrier'
  let carrierLinks = {}; // { 'seur': 'https://.../{tracking}', ... } normalizado en minúsculas sin acentos
  let avisoEmails = []; // lista configurable de emails para el desplegable de avisos por llegada

  const CARRIER_LINKS_KEY = 'recepcion-mercancia-carrier-links';
  const AVISO_EMAILS_KEY = 'recepcion-mercancia-aviso-emails';
  const DEFAULT_CARRIER_LINKS = {
    'seur': 'https://www.seur.com/livetracking/',
    'correos express': 'https://www.correosexpress.com/es/seguimiento',
    'dhl': 'https://www.dhl.com/es-es/home/tracking.html?tracking-id={tracking}',
    'ups': 'https://www.ups.com/track?loc=es_ES&tracknum={tracking}',
    'redur': 'https://www.redur.es/seguimiento',
    'ontime': 'https://www.ontime.es/seguimiento-2/',
    'dsv': 'https://www.dsv.com/en-gb/our-solutions/track-and-trace',
    'gls': 'https://www.gls-spain.es/es/particulares/seguimiento-de-envios/'
  };

  const root = document.getElementById('rm-root');
  const boardEl = document.getElementById('rm-board');
  const carrierViewEl = document.getElementById('rm-carrier-view');
  const tabKanban = document.getElementById('rm-tab-kanban');
  const tabCarrier = document.getElementById('rm-tab-carrier');
  const statusMsg = document.getElementById('rm-status-msg');
  const summaryEl = document.getElementById('rm-summary');
  const avisosEl = document.getElementById('rm-avisos');
  const respSelect = document.getElementById('rm-filter-resp');
  const searchInput = document.getElementById('rm-search');
  const notifBtn = document.getElementById('rm-notif-toggle');

  function uid(){ return 'a_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7); }
  function todayStr(){ return new Date().toISOString().slice(0,10); }
  function nowIso(){ return new Date().toISOString(); }

  function escapeHtml(str){
    return String(str || '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }
  function escapeAttr(str){ return escapeHtml(str); }

  function puntualidad(fechaPrevista, fechaRecepcion){
    if (!fechaPrevista || !fechaRecepcion) return null;
    const diff = Math.round((new Date(fechaRecepcion) - new Date(fechaPrevista)) / 86400000);
    if (diff === 0) return { text: 'a tiempo', late: false };
    if (diff > 0) return { text: diff + 'd de retraso', late: true };
    return { text: Math.abs(diff) + 'd antes de lo previsto', late: false };
  }

  function dateBadge(fecha, estado){
    if (!fecha) return null;
    if (estado === 'recibido') return null;
    const today = new Date(todayStr());
    const target = new Date(fecha);
    const diffDays = Math.round((target - today) / 86400000);
    if (diffDays < 0) return { text: 'ATRASADO ' + Math.abs(diffDays) + 'D', late: true };
    if (diffDays === 0) return { text: 'HOY', late: false };
    if (diffDays === 1) return { text: 'MAÑANA', late: false };
    return { text: 'EN ' + diffDays + 'D', late: false };
  }

  function fechaActual(a){
    return (a && a.fechaEstimada) ? a.fechaEstimada : (a ? a.fecha : null);
  }

  // Intenta detectar una nueva fecha estimada a partir del texto libre de una novedad.
  // baseFecha es la fecha (YYYY-MM-DD) sobre la que aplicar retrasos/adelantos relativos (la estimación actual, o si no hay, la prevista).
  function parseEstimacion(texto, baseFecha){
    if (!texto) return null;
    const t = texto.toLowerCase();
    const base = baseFecha ? new Date(baseFecha) : new Date(todayStr());

    const mFecha = t.match(/(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?/);
    if (mFecha) {
      const d = parseInt(mFecha[1], 10);
      const m = parseInt(mFecha[2], 10);
      if (m >= 1 && m <= 12 && d >= 1 && d <= 31) {
        const year = mFecha[3] ? parseInt(mFecha[3].length === 2 ? '20' + mFecha[3] : mFecha[3], 10) : new Date(todayStr()).getFullYear();
        const dt = new Date(year, m - 1, d);
        if (!isNaN(dt.getTime())) return dt.toISOString().slice(0, 10);
      }
    }

    if (/pasado\s*ma(ñ|n)ana/.test(t)) {
      const dt = new Date(); dt.setDate(dt.getDate() + 2);
      return dt.toISOString().slice(0, 10);
    }
    if (/\bma(ñ|n)ana\b/.test(t)) {
      const dt = new Date(); dt.setDate(dt.getDate() + 1);
      return dt.toISOString().slice(0, 10);
    }
    if (/\bhoy\b/.test(t) || /en reparto/.test(t)) {
      return todayStr();
    }

    const mRet = t.match(/retras\w*\D{0,12}(\d{1,3})\s*d(?:í|i)as?/) || t.match(/(\d{1,3})\s*d(?:í|i)as?\D{0,12}retras\w*/);
    if (mRet) {
      const n = parseInt(mRet[1], 10);
      const dt = new Date(base); dt.setDate(dt.getDate() + n);
      return dt.toISOString().slice(0, 10);
    }

    const mAdv = t.match(/adelant\w*\D{0,12}(\d{1,3})\s*d(?:í|i)as?/) || t.match(/(\d{1,3})\s*d(?:í|i)as?\D{0,12}(?:antes|adelant\w*)/);
    if (mAdv) {
      const n = parseInt(mAdv[1], 10);
      const dt = new Date(base); dt.setDate(dt.getDate() - n);
      return dt.toISOString().slice(0, 10);
    }

    return null;
  }

  function normalizeCarrierName(str){
    return (str || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
  }

  // Busca una plantilla de enlace para el transportista de 'a'. Prioriza el enlace guardado a mano en la ficha (trackingUrl);
  // si no hay, intenta construirlo a partir del transportista + nº de seguimiento y las plantillas configuradas.
  function buildTrackingUrl(a){
    if (a.trackingUrl) return a.trackingUrl;
    if (!a.transportista) return null;
    const norm = normalizeCarrierName(a.transportista);
    const all = Object.assign({}, DEFAULT_CARRIER_LINKS, carrierLinks);
    let template = all[norm];
    if (!template) {
      const key = Object.keys(all).find(k => norm.includes(k) || k.includes(norm));
      if (key) template = all[key];
    }
    if (!template) return null;
    if (template.includes('{tracking}')) {
      if (!a.trackingNumero) return null;
      return template.replace('{tracking}', encodeURIComponent(a.trackingNumero));
    }
    return template;
  }

  function ymdCompact(fecha){ return fecha ? fecha.replace(/-/g, '') : ''; }
  function addDaysCompact(fecha, days){
    const d = new Date(fecha);
    d.setDate(d.getDate() + days);
    return d.toISOString().slice(0, 10).replace(/-/g, '');
  }

  // Genera un enlace que abre Google Calendar con el evento ya rellenado (el usuario solo tiene que confirmar "Guardar").
  function googleCalendarUrl(a){
    const fecha = fechaActual(a);
    if (!fecha) return null;
    const title = 'Recepción: ' + (a.proveedor || 'Envío') + (a.transportista ? ' (' + a.transportista + ')' : '');
    const detailLines = [];
    if (a.pedido) detailLines.push('Pedido: ' + a.pedido);
    if (a.cantidad) detailLines.push('Cantidad: ' + a.cantidad);
    if (a.responsable) detailLines.push('Responsable: ' + a.responsable);
    if (a.trackingNumero) detailLines.push('Seguimiento: ' + a.trackingNumero);
    const trackUrl = buildTrackingUrl(a);
    if (trackUrl) detailLines.push('Enlace de seguimiento: ' + trackUrl);
    const params = new URLSearchParams({
      action: 'TEMPLATE',
      text: title,
      dates: ymdCompact(fecha) + '/' + addDaysCompact(fecha, 1),
      details: detailLines.join('\n')
    });
    return 'https://calendar.google.com/calendar/render?' + params.toString();
  }

  function formatFecha(fecha){
    if (!fecha) return '(sin fecha)';
    const [y,m,d] = fecha.split('-');
    return d + '/' + m + '/' + y;
  }

  function timeAgo(iso){
    if (!iso) return '';
    const diffMs = Date.now() - new Date(iso).getTime();
    const mins = Math.round(diffMs / 60000);
    if (mins < 1) return 'ahora mismo';
    if (mins < 60) return 'hace ' + mins + ' min';
    const hrs = Math.round(mins / 60);
    if (hrs < 24) return 'hace ' + hrs + 'h';
    const days = Math.round(hrs / 24);
    return 'hace ' + days + 'd';
  }

  function formatDateTime(iso){
    if (!iso) return '';
    const d = new Date(iso);
    const dd = String(d.getDate()).padStart(2, '0');
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const hh = String(d.getHours()).padStart(2, '0');
    const mi = String(d.getMinutes()).padStart(2, '0');
    return dd + '/' + mm + '/' + d.getFullYear() + ' ' + hh + ':' + mi;
  }

  function lastHistorial(a){
    if (!a.historial || !a.historial.length) return null;

    a.historial.push({ ts: nowIso(), tipo, texto });

  function startPolling(){
    setInterval(async () => {
      try {
        const res = await window.storage.get(STORAGE_KEY, true);
        const fresh = (res && res.value) ? JSON.parse(res.value) : [];
        fresh.forEach(a => { if (!a.historial) a.historial = []; });
        diffAndNotify(lastSnapshot || [], fresh);
        arrivals = fresh;
        lastSnapshot = JSON.parse(JSON.stringify(arrivals));
        render();
      } catch (e) { /* silent: keep last known state */ }
    }, POLL_MS);
  }

  function diffAndNotify(oldList, newList){
    if (!notifEnabled || typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
    const oldById = Object.fromEntries(oldList.map(a => [a.id, a]));
    newList.forEach(a => {
      const prev = oldById[a.id];
      if (!prev) return; // no aviso por altas nuevas, solo por cambios de seguimiento/estado
      if (prev.estado !== a.estado && (a.estado === 'recibido' || a.estado === 'incidencia' || a.estado === 'hoy')) {
        const label = ESTADOS.find(e => e.key === a.estado).label;
        new Notification('Recepción de mercancía', { body: (a.proveedor || 'Envío') + ' → ' + label });
      }
      const prevHist = prev.historial ? prev.historial.length : 0;
      const newHist = a.historial ? a.historial.length : 0;
      if (newHist > prevHist) {
        const last = a.historial[a.historial.length - 1];
        if (last.tipo === 'nota' || last.tipo === 'estimacion') {
          new Notification('Actualización de seguimiento', { body: (a.proveedor || 'Envío') + ': ' + last.texto });
        }
      }
    });
  }

  function matchesFilters(a){
    if (respFilter && a.responsable !== respFilter) return false;
    if (searchTerm) {
      const hay = (a.proveedor + ' ' + a.transportista + ' ' + a.pedido + ' ' + a.notas + ' ' + (a.trackingNumero||'')).toLowerCase();
      if (!hay.includes(searchTerm.toLowerCase())) return false;
    }
    if (quickFilter === 'atrasados') {
      const b = dateBadge(fechaActual(a), a.estado);
      if (!b || !b.late) return false;
    }
    if (quickFilter === 'hoy') {
      if (fechaActual(a) !== todayStr() || a.estado === 'recibido') return false;
    }
    if (quickFilter === 'actualizados') {
      const h = lastHistorial(a);
      if (!h || (Date.now() - new Date(h.ts).getTime()) > 86400000) return false;
    }
    return true;
  }

  function shiftEstado(id, dir){
    const a = arrivals.find(x => x.id === id);
    if (!a) return;
    const idx = ESTADOS.findIndex(x => x.key === a.estado);
    const newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= ESTADOS.length) return;
    a.estado = ESTADOS[newIdx].key;
    if (a.estado === 'recibido' && !a.fechaRecepcion) a.fechaRecepcion = todayStr();
    addHistorial(a, 'estado', 'Estado cambiado a "' + ESTADOS[newIdx].label + '"');
    render();
    persist();
  }

    const a = arrivals.find(x => x.id === id);

    a.estado = estado;

  function fileToCompressedDataUrl(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 1000;
          let w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
            else { w = Math.round(w * maxDim / h); h = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.6));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function setupSignaturePad(canvas){
    const ctx = canvas.getContext('2d');
    canvas.width = canvas.clientWidth * 2;
    canvas.height = canvas.clientHeight * 2;
    ctx.scale(2, 2);
    ctx.strokeStyle = '#1B2733';
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    let drawing = false;
    let hasDrawn = false;

    function pos(e){
      const r = canvas.getBoundingClientRect();
      return { x: (e.clientX - r.left), y: (e.clientY - r.top) };
    }
    canvas.addEventListener('pointerdown', e => {
      drawing = true;
      const p = pos(e);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener('pointermove', e => {
      if (!drawing) return;
      const p = pos(e);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      hasDrawn = true;
    });
    ['pointerup','pointerleave','pointercancel'].forEach(ev => canvas.addEventListener(ev, () => { drawing = false; }));

    return {
      clear(){ ctx.clearRect(0, 0, canvas.width, canvas.height); hasDrawn = false; },
      isEmpty(){ return !hasDrawn; },
      toDataUrl(){ return canvas.toDataURL('image/png'); }
    };
  }

          <div class="rm-sig-actions">
            <span></span>
            <button type="button" id="rm-inc-sig-clear">Borrar firma</button>
          </div>
          <input type="text" id="rm-inc-firmante" placeholder="Nombre del repartidor" />
        </div>
        <div class="rm-modal-actions">
          <button type="button" class="rm-btn-ghost" id="rm-inc-cancel">Cancelar</button>
          <button type="button" class="rm-btn-warn" id="rm-inc-save">Guardar incidencia</button>
        </div>
      </div>
    `;
    root.appendChild(overlay);

    const sigCanvas = document.getElementById('rm-inc-sig');
    const sigPad = setupSignaturePad(sigCanvas);
    document.getElementById('rm-inc-sig-clear').addEventListener('click', () => sigPad.clear());

    let pendingFiles = [];
    const thumbsEl = document.getElementById('rm-inc-thumbs');
    document.getElementById('rm-inc-photos').addEventListener('change', e => {
      pendingFiles = Array.from(e.target.files || []);
      thumbsEl.innerHTML = '';
      pendingFiles.forEach(f => {
        const url = URL.createObjectURL(f);
        const img = document.createElement('img');
        img.src = url;
        thumbsEl.appendChild(img);
      });
    });

    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
    document.getElementById('rm-inc-cancel').addEventListener('click', () => overlay.remove());

    document.getElementById('rm-inc-save').addEventListener('click', async () => {
      const descripcion = document.getElementById('rm-inc-desc').value.trim();
      if (!descripcion) { alert('Describe brevemente el daño antes de guardar.'); return; }
      const firmante = document.getElementById('rm-inc-firmante').value.trim();
      const saveBtn = document.getElementById('rm-inc-save');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Guardando...';

      const incId = uid();
      const fotoKeys = [];
      try {
        for (let i = 0; i < pendingFiles.length; i++) {
          const dataUrl = await fileToCompressedDataUrl(pendingFiles[i]);
          const key = 'foto:' + arrivalId + ':' + incId + ':' + i;
          await window.storage.set(key, dataUrl, true);
          fotoKeys.push(key);
        }
        let firmaKey = null;
        if (!sigPad.isEmpty()) {
          firmaKey = 'firma:' + arrivalId + ':' + incId;
          await window.storage.set(firmaKey, sigPad.toDataUrl(), true);
        }

        if (!a.incidencias) a.incidencias = [];
        a.incidencias.push({ id: incId, ts: nowIso(), descripcion, fotoKeys, firmaKey, firmante });
        a.estado = 'incidencia';
        addHistorial(a, 'estado', 'Incidencia registrada: ' + descripcion.slice(0, 80) + (firmante ? ' — firmado por ' + firmante : ''));
        await persist();
        overlay.remove();
        render();
        if (onSaved) onSaved();
      } catch (err) {
        alert('No se pudo guardar la incidencia (revisa la conexión). Inténtalo de nuevo.');
        saveBtn.disabled = false;
        saveBtn.textContent = 'Guardar incidencia';
      }
    });
  }

  function openLightbox(dataUrl){
    const lb = document.createElement('div');
    lb.className = 'rm-lightbox';
    lb.innerHTML = '<img src="' + dataUrl + '" />';
    lb.addEventListener('click', () => lb.remove());
    root.appendChild(lb);
  }

  async function viewIncidenciaMedia(key){
    try {
      const res = await window.storage.get(key, true);
      if (res && res.value) openLightbox(res.value);
    } catch (e) {
      alert('No se pudo cargar la imagen.');
    }
  }

  function findByTracking(code){
    const c = code.trim().toLowerCase();
    if (!c) return null;
    return arrivals.find(a => (a.trackingNumero || '').trim().toLowerCase() === c) || null;
  }

  function openScanModal(){
    const overlay = document.createElement('div');
    overlay.className = 'rm-overlay';
    overlay.id = 'rm-scan-overlay';
    overlay.innerHTML = `
      <div class="rm-modal rm-scan-modal">
        <h2>📦 Escanear recepción</h2>
        <div id="rm-scan-form">
          <div class="rm-scan-form-row">
            <input type="text" id="rm-scan-input" class="rm-scan-input" autocomplete="off"
                   placeholder="Escanea la etiqueta o escribe el nº de seguimiento" autofocus />
            <button type="button" class="rm-scan-accept-btn" id="rm-scan-accept">Aceptar</button>
          </div>
        </div>
        <p class="rm-scan-hint">Compatible con lectores de código de barras USB/Bluetooth. Si la pistola pulsa Enter automáticamente, se procesa solo; si no, escribe o escanea el código y pulsa "Aceptar".</p>
        <div id="rm-scan-result"></div>
        <div class="rm-modal-actions">
          <div></div>
          <button type="button" class="rm-btn-ghost" id="rm-scan-close">Cerrar</button>
        </div>
      </div>
    `;
    root.appendChild(overlay);
    overlay.addEventListener('click', e => { if (e.target === overlay) closeScanModal(); });
    document.getElementById('rm-scan-close').addEventListener('click', closeScanModal);

    const input = document.getElementById('rm-scan-input');
    const resultEl = document.getElementById('rm-scan-result');
    let currentId = null;

    function renderResult(){
      if (!currentId) { resultEl.innerHTML = ''; return; }
      const a = arrivals.find(x => x.id === currentId);
      if (!a) { resultEl.innerHTML = ''; currentId = null; return; }
      const esperados = a.bultosEsperados;
      const escaneados = a.bultosEscaneados || 0;
      const over = esperados != null && escaneados > esperados;
      const complete = esperados != null && escaneados >= esperados;
      const pct = esperados ? Math.min(100, Math.round((escaneados / esperados) * 100)) : 0;

      const scanLogs = (a.historial || []).filter(h => h.tipo === 'bulto').slice(-5).reverse();

      resultEl.innerHTML = `
        <div class="rm-scan-panel">
          <h4>${escapeHtml(a.proveedor || '(sin proveedor)')}</h4>
          <div class="rm-scan-meta">
            ${a.pedido ? 'Pedido ' + escapeHtml(a.pedido) + ' · ' : ''}Seg: ${escapeHtml(a.trackingNumero)} · Fecha ${formatFecha(a.fecha)}
          </div>
          ${esperados != null ? `
            <div class="rm-scan-progress-bar"><div class="rm-scan-progress-fill${over ? ' rm-over' : ''}" style="width:${pct}%"></div></div>
            <div class="rm-scan-count${over ? ' rm-over-text' : ''}">${escaneados} / ${esperados} bultos${over ? ' — HAY MÁS BULTOS DE LOS ESPERADOS' : (complete ? ' — completo' : '')}</div>
            ${!complete && !over ? '<div class="rm-scan-remaining">Faltan ' + (esperados - escaneados) + ' bulto' + ((esperados - escaneados) > 1 ? 's' : '') + ' por escanear</div>' : ''}
          ` : `<div class="rm-scan-count">${escaneados} bultos escaneados (sin nº esperado definido)</div>`}
          <div class="rm-scan-actions">
            <button type="button" class="rm-btn-confirm" id="rm-scan-confirm" ${a.estado === 'recibido' ? 'disabled' : ''}>
              ${a.estado === 'recibido' ? 'Ya marcado como recibido' : 'Confirmar recepción completa'}
            </button>
            ${escaneados > 0 ? '<button type="button" class="rm-btn-ghost" id="rm-scan-undo">Deshacer último bulto</button>' : ''}
            <button type="button" class="rm-btn-warn" id="rm-scan-incidencia">⚠️ Bulto dañado / Incidencia</button>
          </div>
          ${scanLogs.length ? '<ul class="rm-scan-log">' + scanLogs.map(h => '<li>' + formatDateTime(h.ts) + ' — ' + escapeHtml(h.texto) + '</li>').join('') + '</ul>' : ''}
        </div>
      `;

      document.getElementById('rm-scan-confirm').addEventListener('click', () => {
        a.estado = 'recibido';
        if (!a.fechaRecepcion) a.fechaRecepcion = todayStr();
        addHistorial(a, 'estado', 'Recepción confirmada (' + escaneados + (esperados != null ? '/' + esperados : '') + ' bultos)');
        persist();
        render();
        renderResult();
      });
      const undoBtn = document.getElementById('rm-scan-undo');
      if (undoBtn) undoBtn.addEventListener('click', () => {
        a.bultosEscaneados = Math.max(0, (a.bultosEscaneados || 0) - 1);
        const idx = a.historial.map(h => h.tipo).lastIndexOf('bulto');
        if (idx !== -1) a.historial.splice(idx, 1);
        persist();
        render();
        renderResult();
      });
      document.getElementById('rm-scan-incidencia').addEventListener('click', () => {
        openIncidenciaModal(a.id, () => renderResult());
      });
    }

    function registerScan(a, code){
      currentId = a.id;
      a.bultosEscaneados = (a.bultosEscaneados || 0) + 1;
      addHistorial(a, 'bulto', 'Bulto escaneado (' + a.bultosEscaneados + (a.bultosEsperados != null ? '/' + a.bultosEsperados : '') + ')');
      persist();
      render();
      renderResult();
      input.focus();
    }

    function renderNotFound(code){
      const candidatos = arrivals.filter(x => x.estado !== 'recibido')
        .sort((x,y) => (x.fecha || '9999').localeCompare(y.fecha || '9999'));

      const options = candidatos.map(x =>
        '<option value="' + x.id + '">' + escapeHtml(x.proveedor || '(sin proveedor)') + ' — ' + formatFecha(x.fecha) +
        (x.transportista ? ' — ' + escapeHtml(x.transportista) : '') +
        (x.trackingNumero ? ' (seg. actual: ' + escapeHtml(x.trackingNumero) + ')' : '') + '</option>'
      ).join('');

      resultEl.innerHTML = `
        <div class="rm-scan-error">No se encontró ningún envío con el nº de seguimiento "${escapeHtml(code)}".</div>
        <div class="rm-scan-notfound-panel">
          <p class="rm-notif-hint" style="margin-top:0;">Puedes introducirlo manualmente asignándolo a una llegada existente:</p>
          ${candidatos.length ? `
            <select id="rm-nf-select">${options}</select>
            <div class="rm-scan-notfound-actions">
              <button type="button" class="rm-btn-confirm" id="rm-nf-assign">Asignar este nº y registrar bulto</button>
            </div>
            <div class="rm-scan-or">— o si el envío no existe todavía —</div>
          ` : '<p class="rm-notif-hint">No hay llegadas pendientes a las que asignarlo todavía.</p>'}
          <button type="button" class="rm-btn-ghost" id="rm-nf-create" style="width:100%;">+ Crear nueva llegada con este nº</button>
        </div>
      `;

      const assignBtn = document.getElementById('rm-nf-assign');
      if (assignBtn) assignBtn.addEventListener('click', () => {
        const sel = document.getElementById('rm-nf-select');
        const target = arrivals.find(x => x.id === sel.value);
        if (!target) return;
        const prevTracking = target.trackingNumero;
        target.trackingNumero = code;
        if (!prevTracking) addHistorial(target, 'nota', 'Seguimiento asignado manualmente: ' + code);
        registerScan(target, code);
      });

      document.getElementById('rm-nf-create').addEventListener('click', () => {
        closeScanModal();
        openModal(null, { trackingNumero: code });
      });

      currentId = null;
      input.focus();
    }

    function processScan(){
      const code = input.value.trim();
      input.value = '';
      if (!code) { input.focus(); return; }
      const a = findByTracking(code);
      if (!a) {
        renderNotFound(code);
        return;
      }
      registerScan(a, code);
    }

    document.getElementById('rm-scan-accept').addEventListener('click', processScan);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        processScan();
      }
    });

    input.focus();
  }

  function closeScanModal(){
    const overlay = document.getElementById('rm-scan-overlay');
    if (overlay) overlay.remove();
  }

  tabKanban.addEventListener('click', () => {
    viewMode = 'kanban';
    tabKanban.classList.add('rm-tab-active');
    tabCarrier.classList.remove('rm-tab-active');
    render();
  });
  tabCarrier.addEventListener('click', () => {
    viewMode = 'carrier';
    tabCarrier.classList.add('rm-tab-active');
    tabKanban.classList.remove('rm-tab-active');
    render();
  });

  document.getElementById('rm-open-scan').addEventListener('click', openScanModal);
  document.getElementById('rm-open-carriers').addEventListener('click', openCarrierLinksModal);
  document.getElementById('rm-open-emails').addEventListener('click', openEmailsModal);
  document.getElementById('rm-open-add').addEventListener('click', () => openModal(null));
  searchInput.addEventListener('input', e => { searchTerm = e.target.value; render(); });
  respSelect.addEventListener('change', e => { respFilter = e.target.value; render(); });

  loadBoard();
})();
</script>
